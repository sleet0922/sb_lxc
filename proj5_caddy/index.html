<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caddy 静态站点</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 56px 72px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 560px;
            width: 90%;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 36px;
        }
        .features {
            text-align: left;
            margin: 28px 0;
            display: grid;
            gap: 10px;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
        }
        .feature::before {
            content: "✔";
            color: #4facfe;
            font-weight: bold;
        }
        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }
        a {
            color: #4facfe;
            text-decoration: none;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Caddy 静态站点</h1>
        <p class="subtitle">单阶段构建 · sb_lxc 容器构建测试</p>
        <div class="features">
            <div class="feature">Caddy v2 (Debian 13 仓库)</div>
            <div class="feature">HTTP/2 自动启用</div>
            <div class="feature">Caddyfile 简洁配置</div>
            <div class="feature">systemd 服务托管</div>
            <div class="feature">健康检查端点 /health</div>
        </div>
        <p class="footer">
            Powered by <a href="https://caddyserver.com/" target="_blank">Caddy</a>
            · Debian 13 · Incus
        </p>
    </div>
</body>
</html>
