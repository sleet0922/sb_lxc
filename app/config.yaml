# 复杂范例配置文件
app:
  name: complex-demo
  version: 1.0.0
  web_port: 8080
  dns_port: 5353

services:
  nginx:
    enabled: true
    port: 80
    root: /app/web
  ssh:
    enabled: true
    port: 22
    permit_root: true
  dnsmasq:
    enabled: true
    port: 5353
    upstream: 8.8.8.8

logging:
  level: info
  path: /app/logs
