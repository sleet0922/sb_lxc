# nginx-static 主配置 (自包含，不 include sites-enabled 避免默认站点冲突)
# 由 sb_lxc 构建时 COPY 到 /etc/nginx/nginx.conf

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    access_log /var/log/nginx/access.log;

    # ─────────── gzip 压缩 ───────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        image/svg+xml;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ─────────── 静态资源回退 ───────────
        location / {
            try_files $uri $uri/ =404;
        }

        # ─────────── 健康检查端点 ───────────
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx-static","built_by":"sb_lxc"}';
        }
    }
}
