<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Fullstack Todo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; }
.container { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); max-width: 600px; width: 100%; padding: 32px; }
h1 { color: #1a1a2e; margin-bottom: 8px; font-size: 28px; }
.subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
.input-row { display: flex; gap: 12px; margin-bottom: 24px; }
input[type="text"] { flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; transition: border-color 0.2s; }
input[type="text"]:focus { outline: none; border-color: #4f46e5; }
button { padding: 12px 24px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; transition: background 0.2s; }
button:hover { background: #4338ca; }
button.danger { background: #ef4444; padding: 6px 12px; font-size: 13px; }
button.danger:hover { background: #dc2626; }
.todo-list { list-style: none; }
.todo-item { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid #f0f0f0; gap: 12px; }
.todo-item:last-child { border-bottom: none; }
.todo-item.done .title { text-decoration: line-through; color: #999; }
.checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: #4f46e5; }
.title { flex: 1; font-size: 15px; color: #333; }
.empty { text-align: center; color: #999; padding: 40px; font-size: 14px; }
.stats { margin-top: 16px; padding-top: 16px; border-top: 1px solid #f0f0f0; color: #666; font-size: 13px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="container">
<h1>Go Fullstack Todo</h1>
<p class="subtitle">Go + embed.FS + 标准库 — sb_lxc 多阶段构建测试</p>
<div class="input-row">
<input type="text" id="title" placeholder="输入待办事项..." onkeydown="if(event.key==='Enter')addTodo()">
<button onclick="addTodo()">添加</button>
</div>
<ul class="todo-list" id="list"></ul>
<div class="stats" id="stats"></div>
</div>
<script>
async function load(){const r=await fetch('/api/todos');const d=await r.json();const l=document.getElementById('list');l.innerHTML='';if(!d.length){l.innerHTML='<div class="empty">暂无待办事项</div>';updateStats(d);return}d.forEach(t=>{const li=document.createElement('li');li.className='todo-item'+(t.done?' done':'');li.innerHTML='<input type="checkbox" class="checkbox" '+(t.done?'checked':'')+' onchange="toggleTodo('+t.id+',this.checked)"><span class="title">'+escapeHtml(t.title)+'</span><button class="danger" onclick="delTodo('+t.id+')">删除</button>';l.appendChild(li)});updateStats(d)}
function updateStats(d){const done=d.filter(t=>t.done).length;document.getElementById('stats').innerHTML='<span>共 '+d.length+' 项</span><span>已完成 '+done+' 项</span>'}
async function addTodo(){const i=document.getElementById('title');const v=i.value.trim();if(!v)return;await fetch('/api/todos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:v})});i.value='';load()}
async function toggleTodo(id,done){await fetch('/api/todos/'+id+'/done',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:done})});load()}
async function delTodo(id){await fetch('/api/todos/'+id,{method:'DELETE'});load()}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
load()
</script>
</body>
</html>
